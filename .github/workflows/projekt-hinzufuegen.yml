name: Projekt hinzufügen

# Läuft, sobald jemand vom Team einem eingereichten Projekt das Label «freigegeben» gibt.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: projekt-hinzufuegen
  cancel-in-progress: false

jobs:
  add:
    if: github.event.label.name == 'freigegeben' && contains(github.event.issue.labels.*.name, 'projekt')
    runs-on: ubuntu-latest
    steps:
      - name: Nur Einreichungen von Teammitgliedern zulassen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          PERM=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission' 2>/dev/null || echo none)
          case "$PERM" in
            admin|maintain|write) echo "Teammitglied: $AUTHOR" ;;
            *) echo "::error::$AUTHOR gehört nicht zum Team. Projekt wird nicht eingetragen."; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Bildwerkzeug installieren
        run: npm install --no-save sharp@0.33.5

      - name: Projekt in Galerie eintragen
        id: add
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node .github/scripts/add-project.mjs

      - name: Änderungen speichern
        env:
          NR: ${{ steps.add.outputs.nr }}
          TITEL: ${{ steps.add.outputs.titel }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "makerspace-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json fotos
          git commit -m "Projekt Nr. $NR: $TITEL (#$ISSUE_NUMBER)"
          git push

      - name: Issue schliessen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} \
            --body "Das Projekt ist jetzt als Nr. ${{ steps.add.outputs.nr }} in der Galerie. Die Seite aktualisiert sich in ein bis zwei Minuten."
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
